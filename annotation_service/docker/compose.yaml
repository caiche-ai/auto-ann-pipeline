name: lisa-annotation

x-common: &common
  image: ${ANNOTATION_IMAGE:-lisa-annotation:groundingdino-v1}
  restart: unless-stopped
  init: true
  user: ${ANNOTATION_CONTAINER_UID:-1000}:${ANNOTATION_CONTAINER_GID:-1000}
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - ${ANNOTATION_STORAGE_HOST_PATH:?set ANNOTATION_STORAGE_HOST_PATH}:/data
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  api:
    <<: *common
    container_name: lisa-annotation-api
    build:
      context: ../..
      dockerfile: annotation_service/docker/Dockerfile
      additional_contexts:
        groundingdino_source: ${GROUNDING_DINO_SOURCE_HOST_PATH:?set GROUNDING_DINO_SOURCE_HOST_PATH}
      args:
        ANNOTATION_BASE_IMAGE: ${ANNOTATION_BASE_IMAGE:-lisa-safety-seg:lisa13b-clean030-v1-records-20260723}
        ANNOTATION_SOURCE_COMMIT: ${ANNOTATION_SOURCE_COMMIT:-unknown}
    command:
      - python3
      - -m
      - uvicorn
      - annotation_service.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "1"
    environment:
      ANNOTATION_SERVICE_VERSION: ${ANNOTATION_SERVICE_VERSION:-1.1.0}
      ANNOTATION_API_KEY: ${ANNOTATION_API_KEY:?set ANNOTATION_API_KEY}
      ANNOTATION_CORS_ORIGINS: ${ANNOTATION_CORS_ORIGINS:?set ANNOTATION_CORS_ORIGINS}
      ANNOTATION_CORS_ALLOW_CREDENTIALS: "false"
      ANNOTATION_DOCS_ENABLED: ${ANNOTATION_DOCS_ENABLED:-true}
      ANNOTATION_STORAGE_ENABLED: "true"
      ANNOTATION_STORAGE_ROOT: /data
      ANNOTATION_MAX_REQUEST_BYTES: ${ANNOTATION_MAX_REQUEST_BYTES:-31457280}
      ANNOTATION_MAX_IMAGE_BYTES: ${ANNOTATION_MAX_IMAGE_BYTES:-20971520}
      ANNOTATION_MAX_IMAGE_PIXELS: ${ANNOTATION_MAX_IMAGE_PIXELS:-25000000}
      ANNOTATION_MAX_METADATA_CHARS: ${ANNOTATION_MAX_METADATA_CHARS:-16384}
      ANNOTATION_MAX_QUEUED_JOBS: ${ANNOTATION_MAX_QUEUED_JOBS:-100}
    ports:
      - ${ANNOTATION_BIND_ADDRESS:-0.0.0.0}:${ANNOTATION_API_PORT:-8008}:8001
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request(
          "http://127.0.0.1:8001/ready",
          headers={"X-API-Key": os.environ["ANNOTATION_API_KEY"]});
          assert urllib.request.urlopen(request, timeout=3).status == 200
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    stop_grace_period: 30s

  worker:
    <<: *common
    container_name: lisa-annotation-grounding-dino
    profiles:
      - models
    command:
      - python3
      - -m
      - annotation_service.worker
    environment:
      ANNOTATION_STORAGE_ROOT: /data
      ANNOTATION_GROUNDING_DINO_ROOT: /models/groundingdino
      ANNOTATION_GROUNDING_DINO_CONFIG: GroundingDINO_SwinT_OGC.py
      ANNOTATION_GROUNDING_DINO_CHECKPOINT: groundingdino_swint_ogc.pth
      ANNOTATION_GROUNDING_DINO_BERT: text_encoder/bert-base-uncased
      ANNOTATION_GROUNDING_DINO_DEVICE: cuda
      ANNOTATION_GROUNDING_DINO_MODEL_VERSION: ${ANNOTATION_GROUNDING_DINO_MODEL_VERSION:-groundingdino-swint-ogc}
      ANNOTATION_GROUNDING_DINO_PROMPT_VERSION: ${ANNOTATION_GROUNDING_DINO_PROMPT_VERSION:-free-form-v1}
      ANNOTATION_GROUNDING_DINO_BOX_THRESHOLD: ${ANNOTATION_GROUNDING_DINO_BOX_THRESHOLD:-0.35}
      ANNOTATION_GROUNDING_DINO_TEXT_THRESHOLD: ${ANNOTATION_GROUNDING_DINO_TEXT_THRESHOLD:-0.25}
      ANNOTATION_WORKER_ID: ${ANNOTATION_WORKER_ID:-grounding-dino-docker-1}
      ANNOTATION_WORKER_LEASE_SECONDS: ${ANNOTATION_WORKER_LEASE_SECONDS:-300}
      ANNOTATION_WORKER_HEARTBEAT_SECONDS: ${ANNOTATION_WORKER_HEARTBEAT_SECONDS:-60}
      ANNOTATION_WORKER_POLL_SECONDS: ${ANNOTATION_WORKER_POLL_SECONDS:-2}
      CUDA_VISIBLE_DEVICES: ${ANNOTATION_CUDA_VISIBLE_DEVICES:-0}
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      HOME: /tmp/annotation-home
      HF_HOME: /tmp/annotation-home/huggingface
      TRANSFORMERS_CACHE: /tmp/annotation-home/huggingface
      XDG_CACHE_HOME: /tmp/annotation-home/cache
    volumes:
      - ${ANNOTATION_STORAGE_HOST_PATH:?set ANNOTATION_STORAGE_HOST_PATH}:/data
      - ${GROUNDING_DINO_MODEL_HOST_PATH:?set GROUNDING_DINO_MODEL_HOST_PATH}:/models/groundingdino:ro
    gpus: all
    shm_size: 1gb
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 90s
