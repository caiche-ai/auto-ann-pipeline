name: lisa-annotation

services:
  annotation_service:
    container_name: annotation_service
    image: ${ANNOTATION_IMAGE:-lisa-annotation:groundingdino-v1}
    build:
      context: ../..
      dockerfile: annotation_service/docker/Dockerfile
      additional_contexts:
        groundingdino_source: ${GROUNDING_DINO_SOURCE_HOST_PATH:?set GROUNDING_DINO_SOURCE_HOST_PATH}
      args:
        ANNOTATION_BASE_IMAGE: ${ANNOTATION_BASE_IMAGE:-lisa-safety-seg:lisa13b-clean030-v1-records-20260723}
        ANNOTATION_SOURCE_COMMIT: ${ANNOTATION_SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    init: true
    user: ${ANNOTATION_CONTAINER_UID:-1000}:${ANNOTATION_CONTAINER_GID:-1000}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    env_file:
      - ${ANNOTATION_ENV_FILE:-.env}
    environment:
      ANNOTATION_SERVICE_VERSION: ${ANNOTATION_SERVICE_VERSION:-1.5.1}
      ANNOTATION_API_KEY: ${ANNOTATION_API_KEY:?set ANNOTATION_API_KEY}
      ANNOTATION_CORS_ORIGINS: ${ANNOTATION_CORS_ORIGINS:?set ANNOTATION_CORS_ORIGINS}
      ANNOTATION_STORAGE_ROOT: /data
      ANNOTATION_GROUNDING_DINO_ROOT: /opt/GroundingDINO
      ANNOTATION_GROUNDING_DINO_CONFIG: /models/groundingdino/GroundingDINO_SwinT_OGC.py
      ANNOTATION_GROUNDING_DINO_CHECKPOINT: /models/groundingdino/groundingdino_swint_ogc.pth
      ANNOTATION_GROUNDING_DINO_BERT: /models/groundingdino/text_encoder/bert-base-uncased
      ANNOTATION_GROUNDING_DINO_DEVICE: cuda
      ANNOTATION_SAM_CHECKPOINT: /models/sam/sam_vit_h_4b8939.pth
      ANNOTATION_SAM_DEVICE: cuda
      ANNOTATION_QWEN_BASE_URL: ${ANNOTATION_QWEN_CONTAINER_BASE_URL:-http://host.docker.internal:18000/qwen25/v1}
      ANNOTATION_PROMPT_TRANSLATOR_BASE_URL: ${ANNOTATION_PROMPT_TRANSLATOR_CONTAINER_BASE_URL:-http://host.docker.internal:18000/qwen25/v1}
      CUDA_VISIBLE_DEVICES: ${ANNOTATION_CUDA_VISIBLE_DEVICES:-0}
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      HOME: /tmp/annotation-home
      HF_HOME: /tmp/annotation-home/huggingface
      TRANSFORMERS_CACHE: /tmp/annotation-home/huggingface
      XDG_CACHE_HOME: /tmp/annotation-home/cache
    volumes:
      - ${ANNOTATION_STORAGE_HOST_PATH:?set ANNOTATION_STORAGE_HOST_PATH}:/data
      - ${GROUNDING_DINO_MODEL_HOST_PATH:?set GROUNDING_DINO_MODEL_HOST_PATH}:/models/groundingdino:ro
      - ${ANNOTATION_SAM_MODEL_HOST_PATH:?set ANNOTATION_SAM_MODEL_HOST_PATH}:/models/sam:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    gpus: all
    shm_size: 1gb
    ports:
      - ${ANNOTATION_BIND_ADDRESS:-0.0.0.0}:${ANNOTATION_API_PORT:-8008}:8001
    command:
      - sh
      - /opt/lisa-annotation/annotation_service/docker/start_all.sh
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request(
          "http://127.0.0.1:8001/ready",
          headers={"X-API-Key": os.environ["ANNOTATION_API_KEY"]});
          assert urllib.request.urlopen(request, timeout=3).status == 200
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    stop_grace_period: 90s
