name: annotation-service-remote-provider

services:
  frontend:
    image: ${ANNOTATION_FRONTEND_IMAGE:-annotation-frontend:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      annotation_service:
        condition: service_healthy
    ports:
      - ${ANNOTATION_FRONTEND_BIND_ADDRESS:-0.0.0.0}:${ANNOTATION_FRONTEND_PORT:-3000}:8080
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/frontend-health
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  annotation_service:
    image: ${ANNOTATION_REMOTE_IMAGE:-annotation-service:remote-provider}
    build:
      context: ..
      dockerfile: docker/Dockerfile.remote
    restart: unless-stopped
    init: true
    user: ${ANNOTATION_CONTAINER_UID:-1000}:${ANNOTATION_CONTAINER_GID:-1000}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    env_file:
      - ${ANNOTATION_ENV_FILE:-.env.remote}
    environment:
      ANNOTATION_STORAGE_ENABLED: "true"
      ANNOTATION_STORAGE_ROOT: /data
      HOME: /tmp/annotation-home
      XDG_CACHE_HOME: /tmp/annotation-home/cache
    volumes:
      - ${ANNOTATION_STORAGE_HOST_PATH:?set ANNOTATION_STORAGE_HOST_PATH}:/data
    ports:
      - ${ANNOTATION_BIND_ADDRESS:-127.0.0.1}:${ANNOTATION_API_PORT:-8008}:8001
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request(
          "http://127.0.0.1:8001/ready",
          headers={"X-API-Key": os.environ["ANNOTATION_API_KEY"]});
          assert urllib.request.urlopen(request, timeout=3).status == 200
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    stop_grace_period: 90s
